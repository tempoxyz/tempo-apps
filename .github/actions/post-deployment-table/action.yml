name: 'Cloudflare Post Deployment'
description: 'Posts a consolidated table of all Cloudflare deployments to a PR'

inputs:
  github-token:
    description: 'GitHub token for posting comments'
    required: true
  deployments-path:
    description: 'Path to directory containing deployment JSON files'
    required: true
  pr-number:
    description: 'Pull request to comment on; defaults to the triggering pull request (a workflow_run has none)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Generate and Post Deployment Table
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        DEPLOYMENTS_PATH: ${{ inputs.deployments-path }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs')
          const path = require('node:path')

          const deploymentsPath = process.env.DEPLOYMENTS_PATH
          const issueNumber = Number(process.env.PR_NUMBER) || context.issue.number
          if (!Number.isInteger(issueNumber) || issueNumber <= 0) throw new Error('No pull request to comment on')
          const deployments = []

          try {
            const files = fs.readdirSync(deploymentsPath)
            for (const file of files) {
              if (file.endsWith('.json')) {
                try {
                  const content = fs.readFileSync(path.join(deploymentsPath, file), 'utf8')
                  const deployment = JSON.parse(content)
                  deployments.push(deployment)
                } catch (parseError) {
                  console.log(`Failed to parse ${file}:`, parseError.message)
                }
              }
            }
          } catch (error) {
            console.log('No deployment files found or error reading them:', error.message)
          }

          deployments.sort((a, b) => {
            const appA = a.app || ''
            const appB = b.app || ''
            if (appA !== appB) return appA.localeCompare(appB)
            const envA = a.env || ''
            const envB = b.env || ''
            return envA.localeCompare(envB)
          })

          const statusEmoji = {
            'success': '[OK]',
            'skipped': '[>>]',
            'failed': '[X]'
          }

          const statusText = {
            'success': 'Deployed',
            'skipped': 'Skipped',
            'failed': 'Failed'
          }

          let tableRows = []
          for (const deployment of deployments) {
            const app = deployment.app
            const env = deployment.env || '-'
            const status = `${statusEmoji[deployment.status] || '[?]'} ${statusText[deployment.status] || 'Unknown'}`

            let preview = '-'
            if (deployment.status === 'success') {
              const url = deployment.deployment_alias_url || deployment.deployment_url
              if (url) {
                preview = `[View Preview](${url})`
              }
            } else if (deployment.status === 'skipped') {
              preview = 'No changes'
            }

            tableRows.push(`| ${app} | ${env} | ${status} | ${preview} |`)
          }

          const marker = '<!-- cloudflare-deployments -->'
          const legacyMarker = '<!-- cloudflare-previews -->'
          let commentBody = marker + '\n'
          commentBody += '## Cloudflare Deployments\n\n'
          commentBody += '| App | Environment | Status | Preview |\n'
          commentBody += '|-----|-------------|--------|---------|\n'
          commentBody += tableRows.join('\n') + '\n\n'
          commentBody += deployments.length === 0 ? '_No deployments found._' : ''

          const repository = { owner: context.repo.owner, repo: context.repo.repo }
          const issue = { ...repository, issue_number: issueNumber }
          const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 })
          const tables = comments.filter(comment =>
            comment.user?.login === 'github-actions[bot]' &&
            (comment.body?.startsWith(marker) || comment.body?.startsWith(legacyMarker))
          )
          const currentTable = tables.find(comment => comment.body.startsWith(marker)) || tables[0]

          if (currentTable) {
            await github.rest.issues.updateComment({
              ...repository,
              comment_id: currentTable.id,
              body: commentBody
            })
            console.log('Updated existing deployment comment')
          } else {
            await github.rest.issues.createComment({ ...issue, body: commentBody })
            console.log('Created new deployment comment')
          }

          for (const table of tables) {
            if (table.id === currentTable.id) continue
            await github.rest.issues.deleteComment({ ...repository, comment_id: table.id })
          }
