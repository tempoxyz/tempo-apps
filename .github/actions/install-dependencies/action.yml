name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819

    - name: Set up Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        cache: 'pnpm'
        # `lts/*` lags a few days to a week
        # up to date LTS can be found here https://endoflife.date/nodejs
        node-version: '24.14.0'

    - name: Install dependencies
      shell: bash
      # Keep install-time hooks out of CI and run any required follow-up steps explicitly.
      run: pnpm install --frozen-lockfile --ignore-scripts
