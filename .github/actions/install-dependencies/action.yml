name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

    - name: Set up Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        cache: 'pnpm'
        # `lts/*` lags a few days to a week
        # up to date LTS can be found here https://endoflife.date/nodejs
        node-version: '24.14.0'

    - name: Install dependencies
      shell: bash
      # Keep install-time hooks out of CI and run any required follow-up steps explicitly.
      run: pnpm install --frozen-lockfile --ignore-scripts
