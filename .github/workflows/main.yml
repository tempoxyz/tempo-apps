name: Main
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    permissions:
      id-token: write
    name: Verify
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

  # One Worker per environment, each built with its own CLOUDFLARE_ENV and
  # deployed in the GitHub environment named like the Worker.
  deploy-explorer:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Explorer (${{ matrix.env }})
    needs: verify
    strategy:
      # A failed environment must not cancel another's deploy: the broker
      # finishes what a cancelled job started.
      fail-fast: false
      matrix:
        env: [testnet, mainnet, devnet, nextfork, zone-prover]
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    # Compiled into the client bundle; unset means no PostHog. Exported to the
    # build command only.
    secrets:
      build-environment: |
        VITE_EXPLORER_POSTHOG_KEY=${{ secrets.VITE_EXPLORER_POSTHOG_KEY }}
        VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
    with:
      app: explorer
      worker: explorer-${{ matrix.env }}
      wrangler-config: dist/server/wrangler.json
      build-command: CLOUDFLARE_ENV=${{ matrix.env }} bash scripts/build.sh

  deploy-fee-payer-moderato:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Fee Payer (moderato)
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: fee-payer
      worker: fee-payer-moderato
      wrangler-config: dist/fee_payer/wrangler.json
      build-command: CLOUDFLARE_ENV=moderato pnpm build

  deploy-fee-payer-mainnet:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Fee Payer (mainnet)
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: fee-payer
      worker: fee-payer-mainnet
      wrangler-config: dist/fee_payer/wrangler.json
      build-command: CLOUDFLARE_ENV=mainnet pnpm build

  # The Worker is `contracts`. The trusted build also builds the verification
  # Container's image and pushes it to the private
  # docker.io/tempoxyz/verification-container, through the Docker Hub OIDC
  # connection in DOCKERHUB_OIDC_CONNECTION_ID. The image compiles solar from
  # source (about 3 minutes on today's runners), hence the longer timeout.
  deploy-contract-verification:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Contract Verification
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: contract-verification
      worker: contracts
      wrangler-config: dist/contracts/wrangler.json
      build-command: pnpm build
      publish-container-image: true
      dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
      build-timeout-minutes: 30

  deploy-key-manager:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Key Manager
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: key-manager

  deploy-og:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy OG
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: og

  deploy-tokenlist:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Tokenlist
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: tokenlist
      wrangler-config: dist/tokenlist/wrangler.json
      build-command: WRANGLER_CONFIG_PATH=wrangler.prd.json pnpm build

  deploy-reth-snapshots-viewer:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Reth Snapshots Viewer
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: reth-snapshots-viewer
      wrangler-config: wrangler.prd.json

  deploy-tempo-snapshots-viewer:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy Tempo Snapshots Viewer
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: tempo-snapshots-viewer
      wrangler-config: wrangler.prd.json

  deploy-mcp-docs-indexer:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Deploy MCP Docs Indexer
    needs: verify
    uses: ./.github/workflows/deploy-broker.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      app: mcp-docs-indexer
      wrangler-config: wrangler.jsonc
