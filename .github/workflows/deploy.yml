name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.affected.outputs.targets }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.22.1'

      # workflow_dispatch and pushes without a usable `before` deploy everything
      - name: Find affected apps
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          targets='[
            {"app":"contract-verification","env":""},
            {"app":"explorer","env":"devnet"},
            {"app":"explorer","env":"mainnet"},
            {"app":"explorer","env":"nextfork"},
            {"app":"explorer","env":"testnet"},
            {"app":"explorer","env":"zone-prover"},
            {"app":"fee-payer","env":"devnet"},
            {"app":"fee-payer","env":"mainnet"},
            {"app":"fee-payer","env":"moderato"},
            {"app":"key-manager","env":""},
            {"app":"mcp-docs-indexer","env":""},
            {"app":"og","env":""},
            {"app":"reth-snapshots-viewer","env":""},
            {"app":"tempo-snapshots-viewer","env":""},
            {"app":"tokenlist","env":""}
          ]'
          if [[ "$EVENT_NAME" != push || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            apps=$(jq -c 'map(.app)' <<< "$targets")
          else
            apps=$(TURBO_SCM_BASE="$BEFORE_SHA" TURBO_SCM_HEAD="$GITHUB_SHA" \
              npx --yes "turbo@$(jq -r .devDependencies.turbo package.json)" ls --affected --output=json |
              jq -c '.packages.items | map(.path | ltrimstr("apps/"))')
          fi
          targets=$(jq -c --argjson apps "$apps" 'map(select(.app as $app | $apps | index($app)))' <<< "$targets")
          echo "$targets" | jq .
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.targets) }}
    env:
      CLOUDFLARE_ENV: ${{ matrix.env }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      # explorer bakes the network into the bundle, mirroring apps/explorer/scripts/build.sh
      - name: Build
        env:
          APP_NAME: ${{ matrix.app }}
          # Compiled into the explorer client bundle. Unset means no PostHog.
          VITE_EXPLORER_POSTHOG_KEY: ${{ matrix.app == 'explorer' && secrets.VITE_EXPLORER_POSTHOG_KEY || '' }}
          VITE_POSTHOG_HOST: ${{ matrix.app == 'explorer' && secrets.VITE_POSTHOG_HOST || '' }}
        run: |
          if [[ "$APP_NAME" == "explorer" ]]; then
            VITE_TEMPO_ENV="$CLOUDFLARE_ENV" pnpm turbo run build --filter="./apps/$APP_NAME" -- --mode="$CLOUDFLARE_ENV"
          else
            pnpm turbo run build --filter="./apps/$APP_NAME"
          fi

      - name: Deploy Worker
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"}
