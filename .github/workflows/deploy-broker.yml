name: Deploy via Broker

# Deploys one production Worker through the Cloudflare Deploy Broker. The build
# job runs the trusted cloudflare-deploy-broker-build.yml, which builds the app
# without any Cloudflare credential and attests its module, configuration and
# assets. The deploy job hands that artifact to the broker, whose policy in
# tempoxyz/cloudflare-deploy-policies (policies/tempoxyz/tempo-apps.yaml) admits
# only main.yml on main, in the GitHub environment named like the Worker.
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
        description: 'App directory under apps/'
      worker:
        required: false
        type: string
        default: ''
        description: 'Worker name, also its broker deployment ID and GitHub environment; defaults to app'
      wrangler-config:
        required: false
        type: string
        default: 'wrangler.json'
        description: 'Wrangler config the broker deploys, relative to apps/<app>; for a Vite app, the config its build emits'
      build-command:
        required: false
        type: string
        default: ''
        description: 'Command run in apps/<app> before packaging, without credentials'

permissions: {}

# One change check, build and deploy per Worker at a time, never cancelled: the
# broker finishes work a cancelled job started, so a cancelled run could still
# deploy after a newer one. A run that starts while another is in progress
# waits, and GitHub keeps only the newest waiting run. Runs can still reach the
# group out of commit order, so the change check skips a run whose app a newer
# commit's run has already deployed.
concurrency:
  group: deploy-${{ inputs.worker || inputs.app }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false

jobs:
  changes:
    permissions:
      # The change check reads earlier runs of the calling workflow.
      actions: read
      contents: read
      # Secure runner fetches its StepSecurity policy-store credential with OIDC.
      id-token: write
    name: ${{ inputs.worker || inputs.app }} changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for relevant changes
        id: changes
        env:
          APP_NAME: ${{ inputs.app }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEPLOY_JOB: ${{ inputs.worker || inputs.app }}
          DEPLOY_STEP: Deploy through the broker
        run: |
          # if workflow_dispatch, always deploy
          #
          paths="^(apps/${APP_NAME}/|pnpm-lock.yaml)"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            relevant=true
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -qE "$paths"; then
            relevant=true
          else
            relevant=false
          fi

          # Runs reach the concurrency group in the order their verify jobs
          # finish, not in commit order, so a run can start after a newer
          # commit's run has already deployed this app. Deploying then would
          # replace newer code with older code (run 45483677537, 2026-11-24).
          # So skip only when a later run of the calling workflow on main, for
          # a descendant of this commit, has already finished this app's
          # "Deploy through the broker" step successfully. A newer run that was dropped
          # while waiting, failed, or skipped the app doesn't count, and any
          # lookup error leaves this run deploying as before.
          if [[ "$relevant" == true ]]; then
            api() {
              for _ in 1 2 3; do
                gh api "$@" && return 0
                sleep 5
              done
              return 1
            }
            workflow="${WORKFLOW_REF%%@*}"
            workflow="${workflow##*/}"
            if ! newer="$(api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=30" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .head_sha != \"${CURRENT_SHA}\") | \"\(.id) \(.head_sha)\"")"; then
              echo "::warning::Could not list runs of ${workflow}; deploying ${CURRENT_SHA}."
              newer=""
            fi
            jobs_filter=".jobs[] | select((.name | endswith(\" / ${DEPLOY_JOB}\")) and any(.steps[]?; .name == \"${DEPLOY_STEP}\" and .conclusion == \"success\")) | .id"
            while read -r run_id run_sha; do
              [[ -n "$run_id" ]] || continue
              git cat-file -e "${run_sha}^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$CURRENT_SHA" "$run_sha" || continue
              if ! deployed="$(api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" --jq "$jobs_filter")"; then
                echo "::warning::Could not read the jobs of run ${run_id}; not counting it."
                continue
              fi
              if [[ -n "$deployed" ]]; then
                echo "::notice::Not deploying ${CURRENT_SHA}: run ${run_id} already deployed ${DEPLOY_JOB} from the newer ${run_sha}."
                relevant=false
                break
              fi
            done <<< "$newer"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    name: Build
    needs: changes
    # The broker admits only main, so a manual run from another branch skips.
    if: needs.changes.outputs.relevant == 'true' && github.ref == 'refs/heads/main'
    uses: tempoxyz/gh-actions/.github/workflows/cloudflare-deploy-broker-build.yml@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
    with:
      install-directory: .
      working-directory: apps/${{ inputs.app }}
      build-command: ${{ inputs.build-command }}
      wrangler-config: ${{ inputs.wrangler-config }}
      artifact-name: ${{ inputs.worker || inputs.app }}

  deploy:
    permissions:
      contents: read
      id-token: write
    name: ${{ inputs.worker || inputs.app }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The broker admits only this environment's OIDC subject for the Worker.
    environment: ${{ inputs.worker || inputs.app }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Deploy through the broker
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          deployment-id: ${{ inputs.worker || inputs.app }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          archive-digest: ${{ needs.build.outputs.archive-digest }}
          module-digest: ${{ needs.build.outputs.module-digest }}
