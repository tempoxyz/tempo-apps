name: Verify
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  NODE_ENV: production
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  checks:
    permissions:
      id-token: write
    name: Checks
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code and types
        run: pnpm gen:types && pnpm check

      - name: Rebuild trusted lint dependency
        run: pnpm rebuild @ast-grep/cli

      - name: Run Tempo Lints
        run: pnpm lint:tempo
