name: Verify
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  NODE_ENV: production
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  checks:
    permissions:
      id-token: write
    name: Checks
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Check code and types
        run: pnpm gen:types && pnpm check

      - name: Test explorer node suite
        run: pnpm check:env
        working-directory: apps/explorer

      - name: Test llms package
        run: pnpm test
        working-directory: packages/llms

      - name: Rebuild trusted lint dependency
        run: pnpm rebuild @ast-grep/cli

      - name: Run Tempo Lints
        run: pnpm lint:tempo
