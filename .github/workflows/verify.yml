name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_CACHE_MAX_SIZE: 100MB
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  checks:
    permissions:
      contents: read
    name: Checks
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-verify-${{ github.sha }}
          restore-keys: |
            turbo-verify-

      # workflow_dispatch and pushes without a usable `before` check everything
      - name: Select affected packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1)
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base=$BEFORE_SHA
          else
            exit 0
          fi
          {
            echo "TURBO_SCM_BASE=$base"
            echo "TURBO_SCM_HEAD=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Check and test
        run: pnpm turbo run check:biome check:types check:env test test:scheduled ${TURBO_SCM_BASE:+--affected}

      - name: Rebuild trusted lint dependency
        if: ${{ !cancelled() }}
        run: pnpm rebuild @ast-grep/cli

      - name: Run Tempo Lints
        if: ${{ !cancelled() }}
        run: pnpm lint:tempo
