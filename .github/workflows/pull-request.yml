name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  check-membership:
    permissions:
      id-token: write
    name: Check Org Membership
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    outputs:
      is-member: ${{ steps.check.outputs.is-member }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Check if PR author is org member
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "is-member=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$AUTHOR_ASSOCIATION" == "MEMBER" || "$AUTHOR_ASSOCIATION" == "OWNER" || "$AUTHOR_ASSOCIATION" == "COLLABORATOR" ]]; then
            echo "is-member=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-member=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    permissions:
      id-token: write
    name: Verify
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

  deploy-preview:
    name: Deploy Preview (${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }})
    needs: check-membership
    if: needs.check-membership.outputs.is-member == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
      contents: read
      pull-requests: write
    strategy:
      matrix:
        include:
          #### explorer
          - app: explorer
            env: testnet
          - app: explorer
            env: devnet
          - app: explorer
            env: nextfork
          - app: explorer
            env: zone-prover
          - app: explorer
            env: mainnet
          #### fee-payer
          - app: fee-payer
            env: devnet
          - app: fee-payer
            env: moderato
          #### other (single-env-apps)
          - app: og
          - app: reth-snapshots-viewer
          - app: tempo-snapshots-viewer
          - app: tokenlist
    env:
      NODE_ENV: production
      CLOUDFLARE_ENV: ${{ matrix.env || '' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      # deploy workspace preview only if there are relevant changes
      # deploy all apps if root lockfile is changed
      - name: Check for relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          APP_NAME: ${{ matrix.app }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "^(apps/${APP_NAME}/|pnpm-lock.yaml)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Generate Worker types
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm gen:types
        working-directory: apps/${{ matrix.app }}

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          if [[ "$APP_NAME" == "explorer" ]]; then
            bash scripts/build.sh
          else
            pnpm build
          fi

      # fee-payer has no preview URL, so check the built Worker locally.
      - name: Verify fee-payer llms.txt
        if: steps.changes.outputs.relevant == 'true' && matrix.app == 'fee-payer'
        working-directory: apps/fee-payer
        run: |
          ./node_modules/.bin/wrangler dev --env-file .env.example --port 8787 \
            --show-interactive-dev-session=false &
          pid=$!
          trap 'kill "$pid"' EXIT
          for file in llms.txt llms-full.txt; do
            curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 \
              --output /dev/null "http://localhost:8787/$file"
          done

      - name: Upload Worker Version
        if: steps.changes.outputs.relevant == 'true'
        id: deploy
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          environment: ${{ env.CLOUDFLARE_ENV }}
          command: versions upload

      - name: Verify zone-prover preview
        if: steps.deploy.outcome == 'success' && matrix.app == 'explorer' && matrix.env == 'zone-prover'
        id: preview-health
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 \
            --output /dev/null "$PREVIEW_URL"

      - name: Verify explorer llms.txt
        if: steps.deploy.outcome == 'success' && matrix.app == 'explorer'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          for file in llms.txt llms-full.txt; do
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 \
              --output /dev/null "$PREVIEW_URL/$file"
          done

      - name: Save Deployment Info
        if: always()
        env:
          RELEVANT_CHANGES: ${{ steps.changes.outputs.relevant }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        shell: bash
        run: |
          mkdir -p deployment-info

          if [[ "$RELEVANT_CHANGES" != "true" ]]; then
            STATUS="skipped"
            DEPLOYMENT_URL=""
            ALIAS_URL=""
          elif [[ "${{ steps.deploy.outcome }}" == "success" && "${{ steps.preview-health.outcome }}" != "failure" ]]; then
            STATUS="success"
          else
            STATUS="failed"
            DEPLOYMENT_URL=""
            ALIAS_URL=""
          fi

          FILENAME="deployment-info/${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}.json"
          cat > "$FILENAME" << EOF
          {
            "app": "${{ matrix.app }}",
            "env": "${{ matrix.env }}",
            "status": "$STATUS",
            "deployment_url": "$DEPLOYMENT_URL",
            "deployment_alias_url": "$ALIAS_URL"
          }
          EOF

          cat "$FILENAME"

      - name: Upload Deployment Info
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deployment-${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
          path: deployment-info/${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}.json
          retention-days: 1

  comment-deployments:
    name: Post Deployment Table
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    needs: [check-membership, deploy-preview]
    if: always() && needs.check-membership.outputs.is-member == 'true'
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download All Deployment Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deployment-*
          path: deployments
          merge-multiple: true

      - name: Post Deployment Table
        uses: ./.github/actions/post-deployment-table # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployments-path: deployments
