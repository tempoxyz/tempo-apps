name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  plan:
    name: Plan
    # Only branches pushed to this repo get secrets; author_association hides private org members.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.affected.outputs.targets }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.22.1'

      # compare the merge commit with its base; workflow_dispatch previews everything
      - name: Find affected apps
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          targets='[
            {"app":"explorer","env":"devnet"},
            {"app":"explorer","env":"mainnet"},
            {"app":"explorer","env":"nextfork"},
            {"app":"explorer","env":"testnet"},
            {"app":"explorer","env":"zone-prover"},
            {"app":"fee-payer","env":"devnet"},
            {"app":"fee-payer","env":"moderato"},
            {"app":"og","env":""},
            {"app":"reth-snapshots-viewer","env":""},
            {"app":"tempo-snapshots-viewer","env":""},
            {"app":"tokenlist","env":""}
          ]'
          if [[ "$EVENT_NAME" != pull_request ]]; then
            apps=$(jq -c 'map(.app)' <<< "$targets")
          else
            apps=$(TURBO_SCM_BASE="$(git rev-parse HEAD^1)" TURBO_SCM_HEAD="$GITHUB_SHA" \
              npx --yes "turbo@$(jq -r .devDependencies.turbo package.json)" ls --affected --output=json |
              jq -c '.packages.items | map(.path | ltrimstr("apps/"))')
          fi
          targets=$(jq -c --argjson apps "$apps" 'map(select(.app as $app | $apps | index($app)))' <<< "$targets")
          echo "$targets" | jq .
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy Preview (${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.targets) }}
    env:
      CLOUDFLARE_ENV: ${{ matrix.env }}
      TARGET: ${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Build
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          if [[ "$APP_NAME" == "explorer" ]]; then
            VITE_TEMPO_ENV="$CLOUDFLARE_ENV" pnpm turbo run build --filter="./apps/$APP_NAME" -- --mode="$CLOUDFLARE_ENV"
          else
            pnpm turbo run build --filter="./apps/$APP_NAME"
          fi

      # fee-payer has no preview URL, so check the built Worker locally.
      - name: Verify fee-payer llms.txt
        if: matrix.app == 'fee-payer'
        working-directory: apps/fee-payer
        run: |
          ./node_modules/.bin/wrangler dev --env-file .env.example --port 8787 \
            --show-interactive-dev-session=false &
          pid=$!
          trap 'kill "$pid"' EXIT
          for file in llms.txt llms-full.txt; do
            curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 \
              --output /dev/null "http://localhost:8787/$file"
          done

      - name: Upload Worker Version
        id: deploy
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          pnpm exec wrangler versions upload ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"}
          jq -r 'select(.type == "version-upload") | "deployment-url=\(.preview_url // "")\ndeployment-alias-url=\(.preview_alias_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify zone-prover preview
        if: steps.deploy.outcome == 'success' && matrix.app == 'explorer' && matrix.env == 'zone-prover'
        id: preview-health
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 \
            --output /dev/null "$PREVIEW_URL"

      - name: Verify explorer llms.txt
        if: steps.deploy.outcome == 'success' && matrix.app == 'explorer'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          for file in llms.txt llms-full.txt; do
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 \
              --output /dev/null "$PREVIEW_URL/$file"
          done

      - name: Save Deployment Info
        if: always()
        env:
          APP_NAME: ${{ matrix.app }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.preview-health.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.deployment-alias-url }}
        shell: bash
        run: |
          mkdir -p deployment-info

          if [[ "$DEPLOY_OUTCOME" == "success" && "$HEALTH_OUTCOME" != "failure" ]]; then
            STATUS="success"
          else
            STATUS="failed"
            DEPLOYMENT_URL=""
            ALIAS_URL=""
          fi

          FILENAME="deployment-info/$TARGET.json"
          jq -n \
            --arg app "$APP_NAME" \
            --arg env "$CLOUDFLARE_ENV" \
            --arg status "$STATUS" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg deployment_alias_url "$ALIAS_URL" \
            '$ARGS.named' > "$FILENAME"

          cat "$FILENAME"

      - name: Upload Deployment Info
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deployment-${{ env.TARGET }}
          path: deployment-info/${{ env.TARGET }}.json
          retention-days: 1

  comment-deployments:
    name: Post Deployment Table
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.deploy-preview.result != 'skipped' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download All Deployment Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deployment-*
          path: deployments
          merge-multiple: true

      - name: Post Deployment Table
        uses: ./.github/actions/post-deployment-table # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployments-path: deployments
