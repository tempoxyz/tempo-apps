name: Test
on:
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "apps/fee-payer/**"
      - "apps/contract-verification/**"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "apps/fee-payer/**"
      - "apps/contract-verification/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  test-fee-payer:
    permissions:
      id-token: write
    name: Test Fee Payer
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Generate Worker types
        run: pnpm gen:types
        working-directory: apps/fee-payer

      - name: Run tests
        run: pnpm test
        working-directory: apps/fee-payer

  test-contracts:
    permissions:
      id-token: write
    name: Test Contract Verification
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Generate Worker types
        run: pnpm gen:types
        working-directory: apps/contract-verification

      - name: Run tests
        run: pnpm test
        working-directory: apps/contract-verification
