name: Publish GitHub Page

on:
  pull_request:
    paths:
      - "apps/tokenlist/**"
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "apps/tokenlist/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_ENV: production
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  pages-directory-listing:
    permissions:
      id-token: write
    name: "Directory Listing Index"
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: "Generate Directory Listings"
        uses: tempoxyz/gh-actions/vendor/jayanta525/github-pages-directory-listing@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          FOLDER: apps/tokenlist/data #directory to generate index

      - name: "Upload Artifact"
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: "apps/tokenlist/data" # upload generated folder

  deploy:
    name: "Deploy tokenlist to GitHub Pages"
    # if the branch is main or invoked by workflow_dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: "pages-directory-listing"
    permissions:
      pages: "write"
      id-token: "write"

    environment:
      name: "tokenlist-github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: "Deploy Pages"
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
