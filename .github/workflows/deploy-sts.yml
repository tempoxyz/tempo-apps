name: Deploy with STS

# Deploys the apps that the Cloudflare Deploy Broker can't deploy (the explorers,
# contract-verification and reth-snapshots-viewer) with `wrangler deploy` and a
# short-lived Cloudflare STS token. Each app's policy in tempoxyz/cloudflare-sts
# (policies/tempo-apps-1088411362/) admits only main.yml's call to this workflow
# on main, and says why the broker can't deploy that app. The other apps deploy
# through deploy-broker.yml.
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      environments:
        required: true
        type: string
        description: 'JSON array of environments to deploy (e.g. ["testnet","devnet"] or [""])'
      sts-policy:
        required: true
        type: string
        description: 'Cloudflare STS policy in tempoxyz/cloudflare-sts (policies/tempo-apps-1088411362/<name>.sts.yaml) that mints the deploy token'
      sts-ttl:
        required: false
        type: string
        default: '10m'
        description: 'Token lifetime, at most the policy max_ttl'
      deploy-timeout-minutes:
        required: false
        type: number
        default: 8
        description: 'Timeout of the deploy step; keep it below sts-ttl so the token outlives the deploy'
    secrets:
      # Compiled into the explorer client bundle. Unset means no PostHog.
      VITE_EXPLORER_POSTHOG_KEY:
        required: false
      VITE_POSTHOG_HOST:
        required: false

# One deploy per app at a time, never cancelled. With cancel-in-progress, a run
# that reached the group late cancelled a newer commit's deploy and then
# deployed its own older code (tempo-apps run 45483677537, 2026-11-24). A run
# that starts while another is in progress now waits, and the change check
# skips a run whose app a newer commit's run has already deployed.
concurrency:
  group: deploy-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  deploy:
    permissions:
      # The change check reads earlier runs of the calling workflow.
      actions: read
      id-token: write
    name: ${{ inputs.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
    # The STS policies admit only main, so a manual run from another branch
    # skips instead of failing at the token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        env: ${{ fromJson(inputs.environments) }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: Check for relevant changes
        id: changes
        env:
          APP_NAME: ${{ inputs.app }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEPLOY_JOB: ${{ inputs.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
          DEPLOY_STEP: Deploy Workers
        run: |
          # if workflow_dispatch, always deploy all
          #
          paths="^(apps/${APP_NAME}/|pnpm-lock.yaml)"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            relevant=true
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -qE "$paths"; then
            relevant=true
          else
            relevant=false
          fi

          # Runs reach the concurrency group in the order their verify jobs
          # finish, not in commit order, so a run can start after a newer
          # commit's run has already deployed this app. Deploying then would
          # replace newer code with older code (run 45483677537, 2026-11-24).
          # So skip only when a later run of the calling workflow on main, for
          # a descendant of this commit, has already finished this app's
          # "Deploy Workers" step successfully. A newer run that was dropped
          # while waiting, failed, or skipped the app doesn't count, and any
          # lookup error leaves this run deploying as before. Re-running an
          # older run therefore can't roll back newer code: revert on main, or
          # roll back the Worker version in Cloudflare.
          if [[ "$relevant" == true ]]; then
            # gh prints an error body to stdout when a call fails, so pass on
            # only the output of the attempt that succeeds.
            api() {
              local out
              for _ in 1 2 3; do
                if out="$(gh api "$@")"; then
                  printf '%s\n' "$out"
                  return 0
                fi
                sleep 5
              done
              return 1
            }
            workflow="${WORKFLOW_REF%%@*}"
            workflow="${workflow##*/}"
            # A newer commit's run is created after this run, give or take
            # GitHub creating push runs asynchronously (a re-run keeps its
            # creation time). So list, on all pages, every run created since an
            # hour before this one; the ancestry check below drops older
            # commits. If this run's creation time can't be read, list the
            # newest 100 runs instead.
            runs="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=100"
            if created="$(api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)" \
              && [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              && since="$(date -u -d "$created - 1 hour" +%Y-%m-%dT%H:%M:%SZ)"; then
              list=(--paginate "${runs}&created=%3E%3D${since}")
            else
              list=("$runs")
            fi
            if ! newer="$(api "${list[@]}" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .head_sha != \"${CURRENT_SHA}\") | \"\(.id) \(.head_sha)\"")"; then
              echo "::warning::Could not list runs of ${workflow}; deploying ${CURRENT_SHA}."
              newer=""
            fi
            jobs_filter=".jobs[] | select((.name | endswith(\" / ${DEPLOY_JOB}\")) and any(.steps[]?; .name == \"${DEPLOY_STEP}\" and .conclusion == \"success\")) | .id"
            while read -r run_id run_sha; do
              [[ "$run_id" =~ ^[0-9]+$ && "$run_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              git cat-file -e "${run_sha}^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$CURRENT_SHA" "$run_sha" || continue
              # Every attempt counts: a later failed re-run doesn't undo an
              # earlier attempt's deploy. Pages that came back count even if a
              # later page failed. Only numeric job IDs count, never an error
              # body that gh printed.
              deployed=""
              read_jobs=false
              for _ in 1 2 3; do
                if part="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" --jq "$jobs_filter")"; then
                  deployed+="${part}"$'\n'
                  read_jobs=true
                  break
                fi
                deployed+="${part}"$'\n'
                sleep 5
              done
              if ! grep -qE '^[0-9]+$' <<< "$deployed" && [[ "$read_jobs" != true ]]; then
                echo "::warning::Could not read the jobs of run ${run_id}; not counting it."
                continue
              fi
              if grep -qE '^[0-9]+$' <<< "$deployed"; then
                echo "::notice::Not deploying ${CURRENT_SHA}: run ${run_id} already deployed ${DEPLOY_JOB} from the newer ${run_sha}."
                relevant=false
                break
              fi
            done <<< "$newer"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Generate Worker types
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/${{ inputs.app }}
        run: pnpm gen:types

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/${{ inputs.app }}
        env:
          NODE_ENV: production
          CLOUDFLARE_ENV: ${{ matrix.env || '' }}
          APP_NAME: ${{ inputs.app }}
          VITE_EXPLORER_POSTHOG_KEY: ${{ secrets.VITE_EXPLORER_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: |
          if [[ "$APP_NAME" == "explorer" ]]; then
            bash scripts/build.sh
          else
            pnpm build
          fi

      # Cloudflare STS mints a short-lived token under this app's policy, which
      # admits only main.yml's call to this workflow on main. The token serves
      # only this runner's IP address, and STS revokes it when the job ends.
      # The Cloudflare Deploy Broker can't deploy these apps; each policy says
      # why.
      - name: Fetch a Cloudflare token
        if: steps.changes.outputs.relevant == 'true'
        id: cloudflare
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          account: prd
          policy: ${{ inputs.sts-policy }}
          ttl: ${{ inputs.sts-ttl }}

      - name: Deploy Workers
        if: steps.changes.outputs.relevant == 'true'
        # Shorter than the token's lifetime (sts-ttl), so the token outlives
        # the deploy.
        timeout-minutes: ${{ inputs.deploy-timeout-minutes }}
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          NODE_ENV: production
          CLOUDFLARE_ENV: ${{ matrix.env || '' }}
        with:
          apiToken: ${{ steps.cloudflare.outputs.token }}
          accountId: ${{ steps.cloudflare.outputs.account-id }}
          workingDirectory: apps/${{ inputs.app }}
          packageManager: pnpm
          command: deploy ${{ matrix.env && format('--env {0}', matrix.env) || '' }}
