name: Preview

# Uploads the pull request previews that preview-build.yml built, of
# fee-payer-moderato and reth-snapshots-viewer, as a version of the app's
# production Worker, and posts the links on the pull request. The other apps'
# previews deploy through the Cloudflare Deploy Broker (preview-deploy.yml). Only
# main's code runs here: `workflow_run` runs main's copy of this workflow, the job
# checks out only main's Wrangler config for the app, and the pull request's
# modules and assets are uploaded as data with main's Wrangler, which bundles
# nothing. A short-lived Cloudflare STS token (tempoxyz/cloudflare-sts,
# `preview-upload`) can upload versions of any Worker in tempo-prd, so no pull
# request code may run in these jobs.
#
# A preview version runs the pull request's code with the production Worker's
# bindings and secrets, as the earlier previews did. Broker Previews need
# preview URLs, which fee-payer-moderato has off, and can't bind
# reth-snapshots-viewer's EU-jurisdiction bucket yet.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only main's code runs, for pull requests from branches of this repository; their files are data.
    types: [completed]
    workflows: [Preview build]

permissions: {}

# One upload per pull request at a time; a newer build replaces an older one.
# A run with no pull request gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  upload-preview:
    name: Upload Preview (${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }})
    # Forks get no OIDC token and are never previewed. Dependabot and other bots
    # are skipped by preview-build.yml's membership check, which leaves no
    # artifact.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Downloads the files of the pull request's Preview build run.
      actions: read
      # Checks out main's Wrangler config and lockfile.
      contents: read
      # The secure-runner action and Cloudflare STS authenticate with an OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with preview-build.yml's matrix.
        include:
          - app: fee-payer
            env: moderato
          - app: reth-snapshots-viewer
    env:
      PREVIEW_ID: ${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # The pull request's run writes the artifact, so it may hold any file. It
      # stays outside the workspace, where it replaces no file of main.
      - name: Download preview
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: preview-${{ env.PREVIEW_ID }}
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}

      # preview-build.yml uploads an artifact for every build it runs, even a
      # failed one. No artifact means it built nothing for this pull request,
      # as for Dependabot, so the app gets no row in the table.
      - name: Read build result
        id: build
        env:
          DOWNLOADED: ${{ steps.download.outcome }}
        run: |
          status=failed
          status_file="$RUNNER_TEMP/preview/status.json"
          if [[ "$DOWNLOADED" != "success" ]]; then
            status=absent
          elif [[ -f "$status_file" ]]; then
            status="$(jq -r 'if (.status | type) == "string" then .status else "failed" end' "$status_file" 2>/dev/null || echo failed)"
          fi
          case "$status" in
            built|skipped|failed|absent) ;;
            *) status=failed ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Only main's config for this app, the config generator and the lockfile,
      # with no package.json, so the Wrangler action installs Wrangler alone.
      - name: Clone repository
        if: steps.build.outputs.status == 'built'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/preview-config.mjs
            /apps/${{ matrix.app }}/wrangler.json
            /pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Set up Node
        if: steps.build.outputs.status == 'built'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.22.1'

      # The Wrangler that main's lockfile resolves for the catalog.
      - name: Read Wrangler version
        if: steps.build.outputs.status == 'built'
        id: wrangler
        run: |
          version="$(awk '/^catalogs:/ { c = 1 } c && /^    wrangler:$/ { getline; getline; print $2; exit }' pnpm-lock.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pnpm-lock.yaml's catalog resolves no Wrangler version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write upload config
        if: steps.build.outputs.status == 'built'
        env:
          APP_NAME: ${{ matrix.app }}
        run: node .github/scripts/preview-config.mjs "apps/$APP_NAME/wrangler.json" "$RUNNER_TEMP/preview" "$RUNNER_TEMP/preview.wrangler.json"

      # The Wrangler action installs Wrangler with npm, without the lockfile. The
      # cutoff resolves each dependency as of a week ago, or as of the locked
      # Wrangler's release when that is newer: pnpm-workspace.yaml's
      # minimumReleaseAge lets main lock a release after one day.
      - name: Set install cutoff
        if: steps.build.outputs.status == 'built'
        id: cutoff
        env:
          VERSION: ${{ steps.wrangler.outputs.version }}
        run: |
          week="$(date -u -d '7 days ago' +%s)"
          published="$(npm view "wrangler@$VERSION" time --json | jq -r --arg v "$VERSION" '.[$v] // empty')"
          if [[ -z "$published" ]]; then
            echo "::error::npm has no publish time for wrangler@$VERSION."
            exit 1
          fi
          released="$(date -u -d "$published" +%s)"
          cutoff=$(( released + 60 > week ? released + 60 : week ))
          echo "before=$(date -u -d "@$cutoff" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Cloudflare STS mints the token under this repository's `preview-upload`
      # policy, which admits only this workflow on main. It serves only this
      # runner's IP address, and STS revokes it when the job ends.
      - name: Fetch a Cloudflare token
        if: steps.build.outputs.status == 'built'
        id: cloudflare
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          account: prd
          policy: preview-upload
          # The job's timeout, so the token outlives the install and the upload.
          ttl: 15m

      # A version upload changes nothing that the Worker serves. The version
      # inherits the Worker's secrets and binds main's bindings.
      - name: Upload Worker Version
        if: steps.build.outputs.status == 'built'
        id: deploy
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          NPM_CONFIG_BEFORE: ${{ steps.cutoff.outputs.before }}
          WRANGLER_SEND_METRICS: false
        with:
          apiToken: ${{ steps.cloudflare.outputs.token }}
          accountId: ${{ steps.cloudflare.outputs.account-id }}
          workingDirectory: apps/${{ matrix.app }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: versions upload --config ${{ runner.temp }}/preview.wrangler.json${{ matrix.env && format(' --env {0}', matrix.env) || '' }}

      - name: Save Deployment Info
        if: always() && steps.build.outputs.status != 'absent'
        env:
          APP: ${{ matrix.app }}
          ENV_NAME: ${{ matrix.env }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          UPLOADED: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          mkdir -p deployment-info
          if [[ "$BUILD_STATUS" == "skipped" ]]; then
            status=skipped
          elif [[ "$UPLOADED" == "success" ]]; then
            status=success
          else
            status=failed
          fi
          if [[ "$status" != "success" ]]; then
            DEPLOYMENT_URL=""
            ALIAS_URL=""
          fi
          jq -n --arg app "$APP" --arg env "$ENV_NAME" --arg status "$status" \
            --arg url "$DEPLOYMENT_URL" --arg alias "$ALIAS_URL" \
            '{app: $app, env: $env, status: $status, deployment_url: $url, deployment_alias_url: $alias}' \
            > "deployment-info/$PREVIEW_ID.json"
          cat "deployment-info/$PREVIEW_ID.json"

      - name: Upload Deployment Info
        if: always() && steps.build.outputs.status != 'absent'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ env.PREVIEW_ID }}
          path: deployment-info/${{ env.PREVIEW_ID }}.json
          retention-days: 1

  comment-deployments:
    name: Post Deployment Table
    needs: upload-preview
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    permissions:
      # The secure-runner action authenticates with an OIDC token.
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # None exist when preview-build.yml built nothing, so nothing is posted.
      - name: Download All Deployment Artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deployment-*
          path: deployments
          merge-multiple: true

      - name: Post Deployment Table
        if: hashFiles('deployments/*.json') != ''
        uses: ./.github/actions/post-deployment-table # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployments-path: deployments
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
