name: Preview build

# Builds the pull request previews of fee-payer-moderato and
# reth-snapshots-viewer with no Cloudflare credential and uploads the result as
# an artifact. preview.yml then runs main's code on `workflow_run`: it uploads
# these files, as data, as a preview version of the app's production Worker
# with a short-lived Cloudflare STS token. Pull request code never runs where a
# tempo-prd token is. The other apps' previews deploy through the Cloudflare
# Deploy Broker (preview-deploy.yml). fee-payer-moderato has preview URLs off,
# which Cloudflare Previews need, and reth-snapshots-viewer's bucket is in the
# EU jurisdiction, which the broker can't bind yet.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false
  NODE_OPTIONS: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

jobs:
  check-membership:
    permissions:
      id-token: write
    name: Check Org Membership
    runs-on: ${{ vars.DEPOT_ENABLED == 'true' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    outputs:
      is-member: ${{ steps.check.outputs.is-member }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Check if PR author is org member
        id: check
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # A branch in this repository needs write access to push, so it is
          # trusted even when the author's org membership is private
          # (author_association then reads CONTRIBUTOR). Bots such as
          # Dependabot also push here but get no Actions secrets, so they
          # still skip previews.
          if [[ "$HEAD_REPO" == "$REPO" && "$AUTHOR_TYPE" != "Bot" ]]; then
            echo "is-member=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$AUTHOR_ASSOCIATION" == "MEMBER" || "$AUTHOR_ASSOCIATION" == "OWNER" || "$AUTHOR_ASSOCIATION" == "COLLABORATOR" ]]; then
            echo "is-member=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-member=false" >> "$GITHUB_OUTPUT"
          fi

  build-preview:
    name: Build Preview (${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }})
    needs: check-membership
    if: needs.check-membership.outputs.is-member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The secure-runner action authenticates with an OIDC token. No
      # Cloudflare policy admits a pull request's token.
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with preview.yml's matrix.
        include:
          - app: fee-payer
            env: moderato
          - app: reth-snapshots-viewer
    env:
      NODE_ENV: production
      CLOUDFLARE_ENV: ${{ matrix.env || '' }}
      PREVIEW_ID: ${{ matrix.app }}${{ matrix.env && format('-{0}', matrix.env) || '' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      # build each preview only if there are relevant changes
      # build all apps if root lockfile is changed
      - name: Check for relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          APP_NAME: ${{ matrix.app }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "^(apps/${APP_NAME}/|pnpm-lock.yaml)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Generate Worker types
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm gen:types
        working-directory: apps/${{ matrix.app }}

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/${{ matrix.app }}
        run: pnpm build

      # fee-payer has no preview URL, so check the built Worker locally.
      - name: Verify fee-payer starts
        if: steps.changes.outputs.relevant == 'true' && matrix.app == 'fee-payer'
        working-directory: apps/fee-payer
        run: |
          ./node_modules/.bin/wrangler dev --env-file .env.example --port 8787 \
            --show-interactive-dev-session=false &
          pid=$!
          trap 'kill "$pid"' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 \
            --output /dev/null "http://localhost:8787/"

      # The modules Wrangler would upload (`deploy --dry-run` writes them
      # without contacting Cloudflare) and the static assets the app's config
      # names. preview.yml uploads these files with main's Wrangler config.
      - name: Package preview
        if: steps.changes.outputs.relevant == 'true'
        id: package
        working-directory: apps/${{ matrix.app }}
        env:
          OUT: ${{ runner.temp }}/preview
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT"
          args=(deploy --dry-run --outdir "$OUT/worker")
          if [[ -n "$CLOUDFLARE_ENV" ]]; then args+=(--env "$CLOUDFLARE_ENV"); fi
          ./node_modules/.bin/wrangler "${args[@]}"
          rm -f "$OUT/worker/README.md" "$OUT"/worker/*.map
          node --input-type=module <<'NODE'
          import { cpSync, existsSync, readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { unstable_readConfig } from "wrangler";

          // A Vite build leaves a redirect to the Wrangler config it emitted.
          const redirect = ".wrangler/deploy/config.json";
          const configPath = existsSync(redirect)
            ? resolve(dirname(redirect), JSON.parse(readFileSync(redirect, "utf8")).configPath)
            : resolve("wrangler.json");
          const environment = existsSync(redirect) ? "" : (process.env.CLOUDFLARE_ENV ?? "");
          const config = unstable_readConfig(
            { config: configPath, ...(environment === "" ? {} : { env: environment }) },
            { hideWarnings: true },
          );
          const directory = config.assets?.directory;
          if (typeof directory === "string") {
            cpSync(resolve(dirname(configPath), directory), resolve(process.env.OUT, "assets"), { recursive: true });
          }
          NODE

      - name: Record build result
        if: always()
        env:
          OUT: ${{ runner.temp }}/preview
          RELEVANT: ${{ steps.changes.outputs.relevant }}
          PACKAGED: ${{ steps.package.outcome }}
        run: |
          mkdir -p "$OUT"
          if [[ "$RELEVANT" != "true" ]]; then
            status=skipped
          elif [[ "$PACKAGED" == "success" ]]; then
            status=built
          else
            status=failed
          fi
          jq -n --arg status "$status" '{status: $status}' > "$OUT/status.json"
          cat "$OUT/status.json"

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ env.PREVIEW_ID }}
          path: ${{ runner.temp }}/preview
          include-hidden-files: true
          retention-days: 1
