# Host-owned template, NOT a runnable catalog. Copy it outside the checkout,
# then replace all three REPLACE_* values after building and checking an image.
images:
  tempo-apps:
    version: "1"
    provider: boat
    template: REPLACE_BOAT_IMAGE_NAME
    build_id: REPLACE_BOAT_SNAPSHOT_UUID
    repository:
      url: https://github.com/tempoxyz/tempo-apps.git
      commit: REPLACE_FULL_GIT_COMMIT

profiles:
  explorer:
    version: "1"
    images: [tempo-apps]
    default_image: tempo-apps
    model: gpt-6-luna
    tools: [remote_exec]
    allow_plan: true
    max_repair_attempts: 2
    review_block_at: high
    inputs:
      - AGENTS.md
      - package.json
      - pnpm-workspace.yaml
      - biome.json
      - apps/explorer/package.json
      - apps/explorer/vitest.node.config.ts
    # Plan selects existing files within these roots. It cannot widen the
    # scope to dependencies, CI, credentials, or this host policy.
    exports: []
    export_roots:
      - apps/explorer/src
      - apps/explorer/test
    max_planned_files: 8
    checks:
      - program: pnpm
        args: [exec, biome, check, apps/explorer]
        test_failure_exit_codes: [1]
      - program: pnpm
        args: [--filter, explorer, check:types]
        test_failure_exit_codes: [1]
      - program: pnpm
        args: [--filter, explorer, check:env]
        test_failure_exit_codes: [1]
      - program: pnpm
        args: [lint:tempo]
        test_failure_exit_codes: [1]
