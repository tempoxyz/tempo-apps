  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  '@vitest/ui': 5.1.0
  '@wagmi/core': ^3.6.9
  '@modelcontextprotocol/sdk': 1.32.2
  accounts: ~0.21.1
  abitype: ^1.3.0
  ai: 7.0.163
  animejs: ^4.5.0
  cloudflare-worker-metrics: ^1.4.0
  cva: ^1.0.0-beta.12
  dotenv: ^18.0.9
  eruda: ^3.4.3
  esbuild: ^0.28.2
  globals: ^17.14.0
  hono: ^4.13.16
  hono-rate-limiter: ^0.5.4
  idxs: ^0.0.6
  kysely: ^0.29.8
  lucide-react: ^1.69.0
  midcut: ^0.2.0
  ox: ^1.8.13
  prool: ^0.2.17
  react: ^19.3.1
  react-dom: ^19.3.1
  regen-ui: 0.5.0
  rollup-plugin-visualizer: ^7.1.2
  shiki: ^4.6.0
  sonda: ^0.14.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.4
  tempo.ts: ^0.14.2
  testcontainers: ^12.2.1
  tidx.ts: ^0.1.2
  tw-animate-css: ^1.4.0
  typed-query-selector: ^2.12.3
  typescript: ^7.0.2
  unplugin-icons: ^24.0.0
  viem: 2.57.16
  vite: ^8.3.6
  vite-plugin-devtools-json: ^1.1.2
  vitest: 5.1.0
  wagmi: ^3.7.11
  wrangler: ^4.158.0
  zod: ^4.6.6
  zyzz: 0.0.44

catalogMode: strict

enablePrePostScripts: true

ignoredBuiltDependencies:
  - '@sentry/cli'
  - bufferutil
  - cadent
  - cbor-extract
  - cpu-features
  - es5-ext
  - protobufjs
  - sharp
  - ssh2
  - vue-demi

# unplugin 3 (via @tanstack/router-plugin) imports types from "bun"; keep Bun's globals out of Workers type checks.
hoistPattern:
  - '*'
  - '!@types/bun'

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'
onlyBuiltDependencies:
  - '@ast-grep/cli'
  - '@j178/prek'
  - '@sentry/cli'
  - esbuild
  - simple-git-hooks
  - utf-8-validate
  - workerd

shellEmulator: true

workspaceConcurrency: -1

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'accounts'
  - 'ox'
  - 'viem'
  - 'wagmi'
  - 'tidx.ts'
  - '@wagmi/core'
  - '@wagmi/connectors'
  - '@cloudflare/containers'

overrides:
  # viem#5325 prerelease (TIP-1106 nonces); return to a release once it ships.
  viem: 2.57.16
  # sharp 0.35.5 bundles a patched libheif (GHSA-rgj7-g3m4-5g8c).
  'sharp@<0.35.5': 0.35.5
  # Patch vulnerable transitive serializers and HTTP clients without changing majors.
  'seroval@<1.7.5': ^1.7.5
  'undici@>=7 <7.30.1': 7.30.1
  # Regen 0.5 uses the preview OTP export renamed in Base UI 1.6.
  regen-ui>@base-ui/react: 1.4.0
  basic-ftp: ^6.2.3
  flatted: ^3.4.2
  'shell-quote@<1.11.0': 1.11.0
  tar: ^7.5.19
  picomatch@<3: ^2.3.2
  picomatch@>=4: ^4.0.4
  lodash: ^4.18.1
  brace-expansion@<3: ^2.1.7
  brace-expansion@>=5: ^5.0.12
  yaml: ^2.8.3
  protobufjs: 7.6.6
  # The MCP SDK accepts ^1.19.9 || ^2.0.5; 2.1.3+ fixes serveStatic double decoding (GHSA-rmxm-3fg6-px4f).
  '@modelcontextprotocol/sdk>@hono/node-server': ^2.1.5
  # miniflare 4 pins ws 8.18.0 (GHSA-58qx-3vcg-4xpx, GHSA-96hv-2xvq-fx4p).
  'ws@>=8 <8.21.0': ^8.21.3
  # @cloudflare/vitest-plugin 1.3.7 resolves zod 4.4.3 (GHSA-mrhx-c7xc-m3w5).
  'zod@>=4 <4.6.6': ^4.6.7
  # vocs 2.12 (latest) needs remark-mdx-frontmatter 5, which uses toml 3; toml 5 keeps parse() (GHSA-v5mp-jgw5-2x6j and others).
  'toml@<5.0.1': 5.0.1
  # archiver 7 (testcontainers) and Sentry/rimraf pull glob 10/13 and minimatch 5/9/10 (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249); bounded at 5 so minimatch 3 consumers stay on 3.
  'glob@>=9.0.0 <14.0.2': 14.0.3
  'minimatch@>=5.0.0 <11.0.1': 11.0.3
  # wata 0.4 (latest) asks for @hono/node-server ^1, all affected by GHSA-rmxm-3fg6-px4f; it only uses getRequestListener, which 2.x keeps.
  'wata>@hono/node-server': ^2.1.5
  # dockerode 4.0.12 (testcontainers 11) pins uuid ^10 (GHSA-w5hq-g745-h8pq); 11.1.1 keeps the CommonJS v4 export it requires.
  'dockerode>uuid': 11.1.1
  # drizzle-kit (latest) still pulls esbuild 0.18 through @esbuild-kit/core-utils (GHSA-67mh-4wv8-2f99).
  '@esbuild-kit/core-utils>esbuild': 0.25.12

patchedDependencies:
  '@cloudflare/vite-plugin@1.61.0': patches/@cloudflare__vite-plugin@1.61.0.patch

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # Published in 2023, after provenance-attested 7.x releases; already locked here.
  - semver@6.3.1
