  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/vitest-plugin': 1.6.0
  '@cloudflare/workers-types': ^5.20261104.1
  '@hono/zod-validator': ^0.9.1
  '@iconify/json': ^2.2.553
  '@logtape/config': ^2.0.4
  '@logtape/drizzle-orm': ^2.4.2
  '@logtape/hono': ^2.4.2
  '@logtape/logtape': ^2.4.2
  '@logtape/pretty': ^2.4.2
  '@logtape/redaction': ^2.0.4
  '@pierre/diffs': 1.2.0
  '@pierre/trees': 1.0.0-beta.6
  '@sentry/cloudflare': ^11.11.0
  '@sentry/react': ^11.11.0
