  '@shazow/whatsabi': ^0.30.0
  '@shikijs/langs': ^4.6.0
  '@shikijs/themes': ^4.6.0
  '@svgr/core': ^8.1.0
  '@svgr/plugin-jsx': ^8.1.0
  '@tailwindcss/vite': ^4.3.4
  '@tanstack/devtools-vite': ^0.8.6
  '@tanstack/query-async-storage-persister': ^5.102.0
  '@tanstack/react-devtools': ^0.10.14
  '@tanstack/react-query': ^5.106.1
  '@tanstack/react-query-devtools': ^5.106.1
  '@tanstack/react-query-persist-client': ^5.102.0
  '@tanstack/react-router': 1.170.46
  '@tanstack/react-router-devtools': ^1.166.11
  '@tanstack/react-router-ssr-query': ^1.167.3
  '@tanstack/react-start': ~1.169.4
  '@tanstack/router-plugin': 1.168.48
